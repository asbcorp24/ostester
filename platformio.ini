[env:nucleo_f767zi]
platform = ststm32
board = nucleo_f767zi
framework = arduino
upload_protocol = stlink

lib_deps =
    stm32duino/STM32duino LwIP
    stm32duino/STM32Ethernet
    stm32duino/STM32duino FreeRTOS
    olikraus/U8g2
    https://github.com/DECE2183/libLua.git
    https://github.com/khoih-prog/FlashStorage_STM32.git

extra_scripts =
    pre:scripts/embed_web.py

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
