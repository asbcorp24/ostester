[env:nucleo_f767zi]
platform = ststm32@17.6.0
board = nucleo_f767zi
framework = arduino
upload_protocol = stlink

upload_flags =
    -c
    reset_config none

lib_deps =
    stm32duino/STM32duino LwIP@2.1.3
    stm32duino/STM32Ethernet@1.4.0
    stm32duino/STM32duino FreeRTOS
    olikraus/U8g2
    https://github.com/DECE2183/libLua.git

extra_scripts =
    pre:scripts/embed_web.py

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
