[env:nucleo_f767zi]
platform = ststm32
board = nucleo_f767zi
framework = arduino
monitor_speed = 115200
upload_protocol = stlink

# Programming/verify succeeds, but some NUCLEO/ST-Link setups fail only on
# the final hardware NRST step. Tell OpenOCD not to require an SRST line.
upload_flags =
    -c
    reset_config none

lib_deps =
    stm32duino/STM32duino LwIP
    stm32duino/STM32Ethernet
    stm32duino/STM32duino FreeRTOS
    olikraus/U8g2
    https://github.com/gianni-carbone/STM32encoder.git
    https://github.com/DECE2183/libLua.git

extra_scripts =
    pre:scripts/embed_web.py

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
