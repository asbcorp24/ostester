<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSTester</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e8edf5;background:#0d1117}*{box-sizing:border-box}body{margin:0}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#161b22;border-bottom:1px solid #30363d}.brand{font-weight:800;font-size:20px}.status{font-size:13px;color:#8b949e}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#da3633;margin-right:7px}.dot.ok{background:#2ea043}.wrap{padding:16px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:16px}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:hidden}.hd{padding:11px 14px;border-bottom:1px solid #30363d;font-weight:700}.body{padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button{border:1px solid #3b4450;background:#21262d;color:#e8edf5;border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:650}button.primary{background:#238636;border-color:#2ea043}button.danger{background:#6e2630;border-color:#a43b46}textarea,pre{width:100%;background:#0d1117;color:#d7e0ea;border:1px solid #30363d;border-radius:8px}textarea{height:520px;resize:vertical;padding:12px;font:14px/1.5 Consolas,monospace;tab-size:2}pre{height:520px;margin:0;padding:12px;overflow:auto;white-space:pre-wrap;font:13px/1.45 Consolas,monospace}.hint{font-size:12px;color:#8b949e;margin-top:9px}.bad{color:#ff7b72}.good{color:#56d364}@media(max-width:900px){.wrap{grid-template-columns:1fr}textarea,pre{height:360px}}
</style>
</head>
<body>
<div class="top"><div class="brand">OSTester · NUCLEO-F767ZI</div><div class="status"><span id="dot" class="dot"></span><span id="st">проверка связи…</span></div></div>
<div class="wrap">
  <section class="card">
    <div class="hd">Lua-цикл</div>
    <div class="body">
      <div class="toolbar"><button class="primary" onclick="runScript()">▶ Запустить</button><button class="danger" onclick="stopScript()">■ Стоп</button><button onclick="exampleClear()">Пример: очистка</button><button onclick="exampleRead()">Пример: чтение</button></div>
      <textarea id="code" spellcheck="false">print("OSTester ready")

bus.invert_addr(false)
bus.invert_data(false)

for addr = 0x0000, 0x0010, 2 do
    bus.write(addr, 0x55AA)
    delay_us(10)
end

print("done")</textarea>
      <div class="hint">Код отправляется непосредственно в Lua-интерпретатор STM32. На первом этапе аппаратные bus.read/write подключаются к GPIO следующим слоем.</div>
    </div>
  </section>
  <section class="card">
    <div class="hd">Результат / журнал</div>
    <div class="body">
      <pre id="out">Ожидание запуска…</pre>
    </div>
  </section>
</div>
<script>
const code=document.getElementById('code'),out=document.getElementById('out'),dot=document.getElementById('dot'),st=document.getElementById('st');
async function status(){try{const r=await fetch('/api/status',{cache:'no-store'});const j=await r.json();dot.classList.add('ok');st.textContent='подключено · '+j.ip+(j.luaRunning?' · Lua выполняется':'');}catch(e){dot.classList.remove('ok');st.textContent='нет связи';}}
async function runScript(){out.textContent='Запуск…\n';try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'text/plain; charset=utf-8'},body:code.value});out.textContent=await r.text();out.className=r.ok?'good':'bad';}catch(e){out.textContent='Ошибка сети: '+e;out.className='bad';}status();}
async function stopScript(){try{const r=await fetch('/api/stop',{method:'POST'});out.textContent+=await r.text();}catch(e){out.textContent+='\nОшибка STOP: '+e;}status();}
function exampleClear(){code.value=`bus.invert_addr(false)\nbus.invert_data(false)\n\nfor addr = 0x0000, 0x00FE, 2 do\n    bus.write(addr, 0x0000)\n    delay_us(5)\nend\n\nprint("memory clear cycle complete")`;}
function exampleRead(){code.value=`for addr = 0x0000, 0x0010, 2 do\n    local value = bus.read(addr)\n    print(string.format("0x%04X = 0x%04X", addr, value))\nend`;}
status();setInterval(status,3000);
</script>
</body>
</html>
